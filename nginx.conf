worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen ${PORT} default_server;
    root /app;
    index index.html;

    # Redirection racine → /tour-de-dour
    location = / {
      return 301 /tour-de-dour;
    }

    # Page principale Tour de Dour
    location = /tour-de-dour {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      try_files /tour-de-dour.html =404;
    }

    # /mascotte → oliviertrevis.be/mascotte
    location = /mascotte {
      return 301 https://www.oliviertrevis.be/mascotte;
    }

    # Assets statiques
    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri /tour-de-dour.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  }
}
